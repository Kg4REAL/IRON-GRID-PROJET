# ==========================================================
# IRON-GRID FIREWALL POLICIES CONFIGURATION
# Location: infrastructure/fortigate/firewall-policies.conf
# ==========================================================

config firewall policy

    # 1. ACCÈS INTERNET POUR LES UTILISATEURS (VLAN 10)
    edit 1
        set name "LAN_TO_WAN"
        set srcintf "vlan10"
        set dstintf "port1"          # Interface WAN
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable        # Activation de la sécurité
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"     # Antivirus actif
        set nat enable               # NAT obligatoire pour Internet
    next

    # 2. ACCÈS AU SERVEUR UBUNTU (MANAGEMENT)
    edit 2
        set name "LAN_TO_SERVER"
        set srcintf "vlan10"
        set dstintf "port4"          # Interface Serveur (192.168.122.150)
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH" "DNS" "LDAP" "SAMBA"
        set logtraffic all
    next

    # 3. ACCÈS VPN SITE-TO-SITE (IPSEC)
    edit 3
        set name "VPN_INBOUND"
        set srcintf "SITE_TO_SITE"   # Ton tunnel VPN
        set dstintf "vlan10"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next

end

# ==========================================================
# SD-WAN STEERING (Optionnel mais recommandé pour ta doc)
# ==========================================================
config router sd-wan
    config health-check
        edit "Google-DNS"
            set server "8.8.8.8"
            set interval 500
            set recoverytime 5
        next
    end
end
