# IRON-GRID — FortiGate LDAP Authentication Configuration
# Target LDAP server: iron.it.local (10.1.20.10)
# Domain: dc=it,dc=local
#
# Note: The binddn password below is stored as a FortiGate ENC hash.
# Never commit plaintext passwords. Use 'set password ENC <hash>' format.

config user ldap
    edit "Ubuntu-LDAP"
        set server "10.1.20.10"
        set cnid "cn"
        set dn "dc=it,dc=local"
        set type regular
        set binddn "cn=admin,dc=it,dc=local"
        set password ENC <fortigate_encrypted_hash_here>
        set secure ldaps
        set port 636
    next
end

config user group
    edit "LDAP-Admins"
        set member "Ubuntu-LDAP"
        config match
            edit 1
                set servername "Ubuntu-LDAP"
                set group "ou=Admins,dc=it,dc=local"
            next
        end
    next
end
