# IRON-GRID SD-WAN Configuration
# Balancing between Starlink (Main) and Local ISP (Backup)

config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
    next
    config members
        edit 1
            set interface "port1" # Starlink
            set gateway 192.168.1.1
        next
        edit 2
            set interface "port4" # Backup ISP
            set gateway 10.0.0.1
        next
    end
    config health-check
        edit "Google-DNS"
            set server "8.8.8.8"
            set members 1 2
        next
    end
end
